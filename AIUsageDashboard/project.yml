name: AIUsageDashboard
options:
  bundleIdPrefix: ai.AIUsageDashboard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
attributes:
  BuildIndependentTargetsInParallel: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
settings:
  base:
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
targets:
  AIUsageDashboardCore:
    type: framework
    platform: macOS
    sources:
      - path: AIUsageDashboardApp/Core
    dependencies:
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.AIUsageDashboard.Core
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: Abhay Padmanabhan (A47GG9FV27)"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: A47GG9FV27
          # Must match AIUsageDashboardApp. Hardened runtime enables library
          # validation, so the app can only load this framework if both carry the
          # same Team ID and the same runtime flag. This framework shipped with
          # the runtime flag even while this said NO, because the app's embed
          # phase re-signs it with the app's options — stating it here makes the
          # invariant explicit instead of a side effect of embedding.
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - AIUsageDashboardCoreTests
  AIUsageDashboardApp:
    type: application
    platform: macOS
    sources:
      - path: AIUsageDashboardApp
        excludes:
          - Core
    dependencies:
      - target: AIUsageDashboardCore
      - package: Sparkle
      # Bundle the read-only agent CLI at Tokei.app/Contents/Helpers/tokei (issue #57).
      # It's a standalone executable, not linked into the app — just copied in.
      - target: tokei
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: AIUsageDashboardApp/Info.plist
      properties:
        CFBundleDisplayName: "Tokei"
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: https://abhaypadmanabhan.github.io/tokei-macos/appcast.xml
        SUPublicEDKey: "HvBBuRxzgqykdxzKWGTlFUVpWx7W16mdwMtkaprDkiI="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Tokei
        PRODUCT_BUNDLE_IDENTIFIER: ai.padzy.tokei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: Abhay Padmanabhan (A47GG9FV27)"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: A47GG9FV27
          ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
  AIUsageDashboardCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Pure UI-layer math (pace notch + tightest-window selection) lives under
      # UI/ per the WP-3 scope, but is a dependency-free function over the frozen
      # Core shapes. Compile that single file into this bundle so the pace/tightest
      # logic is unit-tested by the standard `-scheme AIUsageDashboardCore test`
      # run without pulling the whole app target into the test target.
      - path: AIUsageDashboardApp/UI/MenuBar/MaxxerMath.swift
      # Same mechanism again, for the per-account chart palette: whether two accounts can
      # ever render as the same colour AND the same dash is a pure function of the account
      # index, and a chart whose series collide cannot answer the question it exists for.
      # `PadzyTheme.swift` comes along because the palette names its neutral ink; both are
      # token/logic files with no app-target dependencies.
      - path: AIUsageDashboardApp/UI/Charts/AccountSeriesStyle.swift
      - path: AIUsageDashboardApp/UI/Components/PadzyTheme.swift
      # Same mechanism, for the `tokei` CLI/MCP surface (issue #59). Those files ship in
      # the standalone `tokei` tool target, which does not link Core — so compile the
      # PURE-LOGIC ones in here to get them under `-scheme AIUsageDashboardCore test`.
      # The TOKEI_CLI_TESTS condition below flips on their `import AIUsageDashboardCore`,
      # which the tool target must NOT have (it compiles AgentSnapshot.swift directly).
      # main.swift and StatusCommand.swift stay out: they own process entry / stdout.
      - path: TokeiCLI/MCPServer.swift
      - path: TokeiCLI/SnapshotReader.swift
      - path: TokeiCLI/StatusFormatting.swift
    dependencies:
      - target: AIUsageDashboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.AIUsageDashboard.CoreTests
        # Only this bundle's copy of the TokeiCLI files imports the Core framework.
        # Per-file COMPILER_FLAGS cannot do this — Xcode ignores them for Swift, which
        # compiles a module in one invocation — so the condition is target-wide.
        # NOT a signing setting: this block is disjoint from the Core/App/tokei
        # settings: and configs: that the release-signing package owns.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TOKEI_CLI_TESTS
  # Read-only agent CLI + stdio MCP server (issue #57). Standalone executable —
  # does NOT link the Core framework; it compiles in the shared public schema file
  # directly so it can decode the snapshot with no app-internal dependencies.
  tokei:
    type: tool
    platform: macOS
    sources:
      - path: TokeiCLI
      - path: AIUsageDashboardApp/Core/Agent/AgentSnapshot.swift
    settings:
      base:
        PRODUCT_NAME: tokei
        PRODUCT_BUNDLE_IDENTIFIER: ai.padzy.tokei.cli
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: Abhay Padmanabhan (A47GG9FV27)"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: A47GG9FV27
          ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
